name: .NET CI Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # === اختر أحد الخيارين التاليين ===
    # الخيار 1 (الموصى به): إذا كنت تستهدف .NET 8 المستقر
    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # الخيار 2: إذا كنت تريد استخدام .NET 9 التجريبي
    # - name: Setup .NET 9
    #   uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: '9.0.x' 
    # =================================

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./Digital-Library

    - name: Build solution in Release mode
      run: dotnet build --configuration Release --no-restore
      working-directory: ./Digital-Library

    - name: Run tests in Release mode
      run: dotnet test --configuration Release --no-build --verbosity normal
      working-directory: ./Digital-Library
